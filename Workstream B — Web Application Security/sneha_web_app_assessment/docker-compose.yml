version: '3.8'

services:

  dvwa:
    image: vulnerables/web-dvwa
    container_name: dvwa
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - MYSQL_HOSTNAME=dvwa-db
      - MYSQL_DATABASE=dvwa
      - MYSQL_USERNAME=dvwa
      - MYSQL_PASSWORD=password
    depends_on:
      - dvwa-db
    networks:
      - kavach-net

  dvwa-db:
    image: mariadb:10.5
    container_name: dvwa-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD=rootpassword
      MYSQL_DATABASE=dvwa
      MYSQL_USER=dvwa
      MYSQL_PASSWORD=password
    volumes:
      - dvwa-db-data:/var/lib/mysql
    networks:
      - kavach-net

  juice-shop:
    image: bkimminich/juice-shop
    container_name: juice-shop
    restart: unless-stopped
    ports:
      - "3000:3000"
    networks:
      - kavach-net

  zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    container_name: zap
    restart: unless-stopped
    ports:
      - "8090:8080"
    volumes:
      - ./zap-work:/zap/wrk
    command: zap-webswing.sh
    networks:
      - kavach-net

networks:
  kavach-net:
    driver: bridge

volumes:
  dvwa-db-data:
